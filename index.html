<!DOCTYPE html>
<html lang="id"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frans Marcellino | Elite Vault v8.1.2</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #ffd700;
            --bg: #050505;
            --surface: #0f0f0f;
            --text-main: #fff;
            --text-dim: #888;
            --border: rgba(255,255,255,0.05);
            --transition: cubic-bezier(.23,1,.32,1);
            --glow: rgba(255,215,0,0.15);
            --wave-1: #ffffff;
            --wave-2: #ffd700;
            --wave-3: #ffffff;
        }

        body.light-mode {
            --bg: #f5f5f7;
            --surface: #fff;
            --text-main: #1d1d1f;
            --text-dim: #6e6e73;
            --border: rgba(0,0,0,0.1);
            --wave-1: #1d1d1f;
            --wave-2: #b8860b;
            --wave-3: #1d1d1f;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: "Plus Jakarta Sans", sans-serif; }
        body { background: var(--bg); color: var(--text-main); transition: background .5s var(--transition); overflow-x: hidden; }
        .container { max-width: 1300px; margin: 0 auto; padding: 0 5%; }

        /* --- NAVIGATION --- */
        nav { padding: 20px 0; display: flex; justify-content: space-between; align-items: center; sticky: top; z-index: 1000; background: var(--bg); border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; letter-spacing: 4px; text-transform: uppercase; font-size: 1rem; }
        .logo span { color: var(--primary); }

        /* --- TYPOGRAPHY & WAVE ANIMATION --- */
        #hero-title, #market-title, #about-title, #faq-title {
            background: linear-gradient(90deg, var(--wave-1) 35%, var(--wave-2) 50%, var(--wave-3) 65%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: lightWaveEffect 5s linear infinite;
        }

        #hero-title, #about-title {
            font-family: "Playfair Display", serif !important;
            font-style: italic !important;
            font-weight: 900 !important;
        }

        @keyframes lightWaveEffect {
            0% { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        /* --- GRID & CARDS (FIXED) --- */
        .grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); 
            gap: 25px; 
            margin-top: 40px;
        }

        .card { 
            background: var(--surface); 
            border: 1px solid var(--border); 
            border-radius: 24px; 
            padding: 30px; 
            position: relative; 
            transition: .4s var(--transition);
            display: flex;
            flex-direction: column;
            height: 100%;
        }

        .card:hover { border-color: var(--primary); transform: translateY(-10px); }

        .card-img-container {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            overflow: hidden;
            margin-bottom: 20px;
            position: relative;
        }

        .card-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .price-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            background: var(--primary);
            color: #000;
            padding: 8px 15px;
            border-radius: 12px;
            font-weight: 800;
            font-size: 0.9rem;
        }

        /* --- MODAL & PAYMENT METHOD --- */
        #modal {
            position: fixed; inset: 0; 
            background: rgba(0,0,0,0.9); 
            backdrop-filter: blur(10px); 
            display: none; 
            justify-content: center; 
            align-items: center; 
            z-index: 2000;
        }

        .m-box { 
            background: var(--surface); 
            padding: 40px; 
            border-radius: 30px; 
            width: 90%; 
            max-width: 450px; 
            text-align: center;
            border: 1px solid var(--border);
        }

        .modal-price {
            font-size: 3rem;
            font-weight: 900;
            margin: 20px 0;
            background: linear-gradient(45deg, #ffd700, #ff8c00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            /* Animasi Harga Kembali */
            animation: priceGlow 3s infinite alternate;
        }

        @keyframes priceGlow {
            from { filter: drop-shadow(0 0 5px rgba(255,215,0,0.3)); }
            to { filter: drop-shadow(0 0 20px rgba(255,215,0,0.6)); }
        }

        .modal-input {
            width: 100%; padding: 15px; 
            margin-bottom: 15px; 
            background: var(--bg); 
            border: 1px solid var(--border); 
            color: var(--text-main); 
            border-radius: 12px;
            text-align: center;
        }

        .btn-premium {
            background: var(--primary); 
            color: #000; 
            padding: 15px; 
            width: 100%; 
            border-radius: 12px; 
            font-weight: 800; 
            border: none; 
            cursor: pointer;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <h1 class="logo">FRANS <span>MARCELLINO</span></h1>
        <button class="btn-premium" style="width: auto; padding: 10px 20px;" onclick="document.body.classList.toggle('light-mode')">THEME</button>
    </nav>

    <section id="about" style="padding: 80px 0; text-align: center;">
        <h2 id="about-title" style="font-size: 3rem;">The Architecture of Absolute Precision</h2>
        <p style="color: var(--text-dim); margin-top: 10px;">VALIDATED CORE & EMPIRICAL PERFORMANCE</p>
        
        <div class="grid">
            <div class="card">
                <div class="card-img-container">
                    <span class="price-badge">$2,999</span>
                    <img src="https://via.placeholder.com/400x300" alt="Nebula AI">
                </div>
                <h3 style="color: var(--primary);">Zero-Error Technical Integrity</h3>
                <p style="color: var(--text-dim); font-size: 0.9rem; margin-top: 10px;">Elite Vault V8 is engineered for those who demand absolute stability.</p>
                <button class="btn-premium" style="margin-top: 20px;" onclick="openModal('NEBULA AI', '$2,999')">REQUEST LICENSE</button>
            </div>
        </div>
    </section>
</div>

<div id="modal">
    <div class="m-box">
        <p style="font-size: 0.8rem; letter-spacing: 2px; color: var(--text-dim);">ASSET SELECTION</p>
        <h3 id="target-name" style="color: var(--primary); margin: 10px 0;"></h3>
        <p id="target-price" class="modal-price"></p>
        <input type="text" placeholder="VERIFY FULL NAME" class="modal-input">
        <button class="btn-premium">CONFIRM ACQUISITION</button>
        <button onclick="document.getElementById('modal').style.display='none'" style="background:none; border:none; color:var(--text-dim); margin-top:20px; cursor:pointer;">CANCEL PROTOCOL</button>
    </div>
</div>

<script>
    function openModal(name, price) {
        document.getElementById('target-name').innerText = name;
        document.getElementById('target-price').innerText = price;
        document.getElementById('modal').style.display = 'flex';
    }
</script>

</body>
</html>
