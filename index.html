<!DOCTYPE html>
<html lang="id"> 
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Frans Marcellino | Elite Vault v8.1.1 — Digital Architect Portfolio</title>
<meta name="description" content="Official repository of Frans Marcellino. Industrial-grade software assets and AI Cinematic Artistry. Established 2026.">
<meta name="author" content="Frans Marcellino">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" media="print" onload="this.media='all'">

<style>
/* CORE SYSTEM - Elite Vault v8.1.1 */
:root{--primary:#ffd700;--bg:#050505;--surface:#0f0f0f;--text-main:#fff;--text-dim:#888;--border:rgba(255,255,255,0.05);--transition:cubic-bezier(.23,1,.32,1);--glow:rgba(255,215,0,0.15);--accent-gradient:linear-gradient(45deg,#ffd700,#ff8c00)}
body.light-mode{--bg:#f5f5f7;--surface:#fff;--text-main:#1d1d1f;--text-dim:#6e6e73;--border:rgba(0,0,0,0.1);--glow:rgba(255,215,0,0.3)}

*{margin:0;padding:0;box-sizing:border-box;font-family:"Plus Jakarta Sans",sans-serif;cursor:none}

.visually-hidden {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
}

#cursor{width:20px;height:20px;background:var(--primary);border-radius:50%;position:fixed;pointer-events:none;z-index:9999;mix-blend-mode:difference;transition:transform .15s ease-out;transform:translate3d(-50%,-50%,0);box-shadow:0 0 20px var(--primary);will-change:transform}
@media (max-width:768px){#cursor{display:none}*{cursor:auto!important}}

body{background:var(--bg);color:var(--text-main);line-height:1.6;transition:background .5s var(--transition);overflow-x:hidden}
.container{max-width:1300px;margin:0 auto;padding:0 5%}

nav{padding:20px 0;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:1000;background:var(--bg);backdrop-filter:blur(25px);border-bottom:1px solid var(--border)}
.logo{font-weight:800;letter-spacing:4px;font-size:1rem;text-transform:uppercase;cursor:pointer}
.logo span{color:var(--primary);text-shadow:0 0 10px var(--glow)}
.nav-controls{display:flex;align-items:center;gap:15px}
.theme-toggle{background:var(--surface);border:1px solid var(--border);color:var(--text-main);padding:10px 18px;border-radius:12px;font-weight:700;font-size:.65rem;transition:.3s var(--transition);cursor:pointer}
.kebab-btn{background:none;border:1px solid var(--border);padding:12px;border-radius:14px;display:flex;flex-direction:column;gap:4px;cursor:pointer}
.dot{width:4px;height:4px;background:var(--text-main);border-radius:50%}

.dropdown-menu{position:absolute;right:0;top:100%;background:var(--surface);border:1px solid var(--border);border-radius:20px;width:220px;z-index:1001;box-shadow:0 20px 40px rgba(0,0,0,.4);display:none;opacity:0;transform:translateY(-10px);transition:opacity .3s var(--transition),transform .3s var(--transition);overflow:hidden}
.dropdown-menu.active{display:block;opacity:1;transform:translateY(0)}
.page{display:none;opacity:0;transform:translateY(20px);filter:blur(5px);transition:opacity .6s var(--transition),transform .6s var(--transition),filter .6s var(--transition);padding:60px 0;min-height:80vh}
.page.active{display:block;opacity:1;transform:translateY(0);filter:blur(0)}

.hero{text-align:center;position:relative;padding:120px 0}
.hero h2{font-family:"Playfair Display",serif!important;font-size:clamp(2.5rem,8vw,5.5rem);font-weight:900;margin-bottom:24px;line-height:1.1;font-style:italic}
.hero-badge-style{font-size:.7rem;letter-spacing:8px;color:var(--primary);margin-bottom:30px;font-weight:800;text-transform:uppercase}
.hero-desc-style{color:var(--text-dim);max-width:750px;margin:0 auto 50px;font-size:1.15rem;font-weight:300}

.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:32px;margin-top:50px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:28px;padding:40px;position:relative;overflow:hidden;backdrop-filter:blur(10px);box-shadow:0 10px 30px rgba(0,0,0,.5);transition:.6s var(--transition)}

footer{text-align:center;padding:100px 0 60px;color:var(--text-dim);border-top:1px solid var(--border);position:relative;margin-top:80px}

/* FAQ STYLE */
.faq-item{border-bottom:1px solid var(--border);margin-bottom:10px;text-align:left}
.faq-question{width:100%;background:none;border:none;color:var(--text-main);padding:18px;font-weight:700;cursor:pointer;text-align:left}
.faq-answer{max-height:0;overflow:hidden;transition:0.4s ease}
.faq-answer p{padding:0 18px 18px;color:var(--text-dim)}
</style>
</head>
<body>

<div class="container">

<main id="main-content">
<section id="home" class="page active">
<h2>Architecting Digital Sovereignty.</h2>
</section>

<section id="faq" style="padding:100px 0;">
<div style="max-width:900px;margin:0 auto;text-align:center;">
<h2>Frequently Asked Questions</h2>

<div class="faq-item">
<button class="faq-question">What makes this template different?</button>
<div class="faq-answer"><p>Built with elite design, performance-first architecture, and W3C compliance.</p></div>
</div>

<div class="faq-item">
<button class="faq-question">Can beginners use this?</button>
<div class="faq-answer"><p>Yes, structure is simple and easy to customize.</p></div>
</div>

<div class="faq-item">
<button class="faq-question">Is it optimized?</button>
<div class="faq-answer"><p>Highly optimized for speed and smooth UX.</p></div>
</div>

<div class="faq-item">
<button class="faq-question">Can I use it commercially?</button>
<div class="faq-answer"><p>Yes, allowed for personal and client projects.</p></div>
</div>

</div>
</section>

</main>

<footer></footer>

<script>
document.querySelectorAll(".faq-question").forEach(btn=>{
btn.addEventListener("click",()=>{
const answer=btn.nextElementSibling;
answer.style.maxHeight?answer.style.maxHeight=null:answer.style.maxHeight=answer.scrollHeight+"px";
});
});
</script>

</body>
</html>
