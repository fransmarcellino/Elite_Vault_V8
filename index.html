<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FRANS MARCELLINO | Elite Vault v8.2.9</title>
    <meta name="description" content="Engineering Digital Authority - Premium Digital Assets & AI Cinematic Architect.">
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Playfair+Display:ital,wght@1,900&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #ffd700;
            --bg-dark: #0a0a0a;
            --text-main: #ffffff;
            --text-dim: rgba(255,255,255,0.6);
            --border: rgba(255,215,0,0.15);
            --card-bg: rgba(255,255,255,0.03);
            --transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
        }

        .light-mode {
            --bg-dark: #f5f5f5;
            --text-main: #1a1a1a;
            --text-dim: rgba(0,0,0,0.6);
            --border: rgba(0,0,0,0.1);
            --card-bg: #ffffff;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            background-color: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
            transition: background 0.5s ease;
        }

        /* Custom Cursor for Desktop */
        #cursor {
            width: 20px; height: 20px; background: var(--primary);
            border-radius: 50%; position: fixed; pointer-events: none;
            z-index: 9999; mix-blend-mode: difference; transition: transform 0.1s ease-out;
            display: none;
        }
        @media (min-width: 1024px) { #cursor { display: block; } }

        /* Typography & Layout */
        header {
            padding: 20px 5%; display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0; z-index: 1000; backdrop-filter: blur(15px);
        }

        .nav-brand { font-weight: 900; letter-spacing: 2px; font-size: 1.2rem; cursor: pointer; }
        .nav-brand span { color: var(--primary); }

        .container { max-width: 1400px; margin: 0 auto; padding: 0 5%; }

        /* Page Systems */
        .page { display: none; padding: 60px 0; animation: fadeIn 0.8s ease forwards; }
        .page.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Hero Section */
        #hero-title {
            font-size: clamp(2.5rem, 10vw, 5rem); font-weight: 900; line-height: 1;
            margin: 100px 0 40px; text-align: center; height: 1.2em;
        }

        /* Search Bar */
        .search-wrapper { margin-bottom: 50px; position: relative; }
        #search-bar {
            width: 100%; padding: 20px 30px; background: var(--card-bg);
            border: 1px solid var(--border); border-radius: 50px; color: var(--text-main);
            font-size: 1rem; outline: none; transition: var(--transition);
        }
        #search-bar:focus { border-color: var(--primary); box-shadow: 0 0 20px rgba(255,215,0,0.1); }

        /* Grid & Cards */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .card {
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 20px;
            padding: 25px; position: relative; overflow: hidden; transition: var(--transition);
            display: flex; flex-direction: column;
        }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); background: rgba(255,215,0,0.02); }
        .card-img { width: 100%; border-radius: 12px; margin-bottom: 20px; object-fit: cover; aspect-ratio: 16/9; }

        .price-tag {
            position: absolute; top: 15px; right: 15px; background: var(--primary);
            color: #000; padding: 5px 15px; border-radius: 30px; font-weight: 900; font-size: 0.8rem; z-index: 10;
        }

        .btn-premium {
            background: var(--primary); color: #000; border: none; padding: 15px;
            border-radius: 10px; font-weight: 700; cursor: pointer; transition: 0.3s; width: 100%;
        }
        .btn-premium:hover { opacity: 0.9; transform: scale(0.98); }

        /* Kebab Menu & Modal */
        .dropdown {
            position: absolute; top: 70px; right: 5%; background: var(--bg-dark);
            border: 1px solid var(--border); border-radius: 15px; display: none; overflow: hidden;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4); min-width: 200px;
        }
        .dropdown.active { animation: slideDown 0.3s ease forwards; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }

        .modal {
            position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 2000;
            display: none; align-items: center; justify-content: center; backdrop-filter: blur(10px);
        }
        .modal-content {
            background: var(--bg-dark); border: 1px solid var(--primary); padding: 40px;
            border-radius: 24px; width: 90%; max-width: 500px; position: relative;
        }

        .method-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; margin: 20px 0; }
        .method-card {
            border: 1px solid var(--border); padding: 15px; border-radius: 12px;
            text-align: center; cursor: pointer; transition: 0.3s;
        }
        .method-card.active { border-color: var(--primary); background: rgba(255,215,0,0.1); }

        /* AI Video Simulator Overlay */
        .ev-video-bg {
            position: absolute; inset: 0; opacity: 0.1; pointer-events: none; z-index: 0;
            background-size: cover; background-position: center;
        }

        footer { text-align: center; padding: 60px 0; border-top: 1px solid var(--border); margin-top: 100px; }
    </style>
</head>
<body>

<div id="cursor"></div>

<header>
    <div class="nav-brand" onclick="navigateTo('home')">FRANS <span>MARCELLINO</span></div>
    <div style="display: flex; gap: 15px; align-items: center;">
        <button id="theme-btn" class="btn-premium" style="padding: 8px 15px; font-size: 0.7rem;" onclick="toggleTheme()">LIGHT MODE</button>
        <div id="kebab-menu-btn" onclick="toggleMenu()" style="cursor: pointer; padding: 5px;">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><circle cx="12" cy="5" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="12" cy="19" r="2"/></svg>
        </div>
    </div>
    <div id="dropdown" class="dropdown">
        <div id="social-links"></div>
    </div>
</header>

<div class="container">
    <section id="home" class="page active">
        <h1 id="hero-title"></h1>
        <div class="search-wrapper">
            <input type="text" id="search-bar" placeholder="Search premium assets (e.g. AI, SaaS, UI)..." oninput="optimizedSearch()">
        </div>
        <h2 id="repo-title">Market Repository</h2>
        <div id="main-grid" class="grid"></div>
    </section>

    <section id="market" class="page">
        <h2 style="text-align: center; margin-bottom: 40px;">The Vault Collection</h2>
        <div id="vault-grid" class="grid"></div>
    </section>

    <section id="faq" class="page">
        <h2 id="faq-title">Technical Protocols</h2>
        <div id="faq-grid" class="grid"></div>
    </section>
</div>

<footer>
    <p id="footer-text"></p>
</footer>

<div id="modal" class="modal">
    <div class="modal-content">
        <h2 id="target-name" style="margin-bottom: 5px; color: var(--primary);"></h2>
        <p id="target-price" style="margin-bottom: 25px; opacity: 0.7;"></p>
        
        <label style="font-size: 0.8rem; margin-bottom: 10px; display: block;">CLIENT IDENTITY</label>
        <input type="text" id="client-name" placeholder="Full Name / Company" style="width: 100%; padding: 15px; background: rgba(255,255,255,0.05); border: 1px solid var(--border); border-radius: 10px; color: #fff; margin-bottom: 20px;">
        
        <label style="font-size: 0.8rem; margin-bottom: 10px; display: block;">PAYMENT GATEWAY</label>
        <div class="method-grid">
            <div class="method-card active" onclick="selectPayment('PayPal', this)">PayPal</div>
            <div class="method-card" onclick="selectPayment('Stripe', this)">Stripe</div>
            <div class="method-card" onclick="selectPayment('Gumroad', this)">Gumroad</div>
            <div class="method-card" onclick="selectPayment('Crypto', this)">USDT/BTC</div>
        </div>
        
        <div style="display: flex; gap: 10px; margin-top: 30px;">
            <button class="btn-premium" onclick="confirmInquiry()">INQUIRE LICENSE</button>
            <button class="btn-premium" style="background: transparent; border: 1px solid var(--border); color: var(--text-main);" onclick="closeModal()">CANCEL</button>
        </div>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
