<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frans Marcellino | Elite Vault v8.0</title>
    
    <meta name="description" content="Elite Vault v8.0 by Frans Marcellino. Sovereign digital repository with industrial-grade software assets." />
    <meta name="author" content="Frans Marcellino" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com">

    <style>
        :root { --primary: #FFD700; --surface: #0a0a0a; --text-main: #ffffff; --text-dim: #a0a0a0; --border: rgba(255,255,255,0.1); }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { background: var(--surface); color: var(--text-main); font-family: sans-serif; overflow-x: hidden; line-height: 1.6; }
        .container { max-width: 1400px; margin: 0 auto; padding: 0 20px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 30px 0; background: var(--surface); position: relative; z-index: 100; }
        .logo { font-weight: 800; font-size: 1.2rem; cursor: pointer; letter-spacing: 2px; }
        .logo span { color: var(--primary); }

        .hero { min-height: 85vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }
        .hero-badge-style { font-size: 0.7rem; letter-spacing: 4px; color: var(--primary); margin-bottom: 20px; text-transform: uppercase; }
        h1 { font-size: clamp(2rem, 8vw, 4.5rem); line-height: 1.1; margin-bottom: 20px; font-weight: 900; }
        .hero-desc-style { color: var(--text-dim); max-width: 650px; margin: 0 auto 35px; font-size: 1.1rem; }
        
        .btn-premium { background: var(--primary); color: #000; border: none; padding: 18px 35px; font-weight: 800; border-radius: 50px; cursor: pointer; text-transform: uppercase; letter-spacing: 1px; transition: 0.3s; }
        
        .page { display: none; opacity: 0; }
        .page.active { display: block; opacity: 1; }

        /* Menu Styles */
        .nav-controls { display: flex; align-items: center; gap: 15px; }
        .theme-toggle { background: transparent; border: 1px solid var(--border); color: var(--text-main); padding: 8px 15px; border-radius: 20px; font-size: 0.7rem; cursor: pointer; }
        
        /* Modal & Footer placeholder to prevent CLS */
        footer { padding: 60px 0; border-top: 1px solid var(--border); margin-top: 100px; text-align: center; }
    </style>

    <link rel="stylesheet" href="assets/css/style.css" media="print" onload="this.media='all'">
</head>
<body>
    <div id="cursor" aria-hidden="true"></div>

    <div class="container">
        <nav aria-label="Primary Navigation">
            <div class="logo" id="nav-logo" onclick="navigateTo('home')" role="button" tabindex="0">
                FRANS <span>MARCELLINO</span>
            </div>
            <div class="nav-controls">
                <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">LIGHT MODE</button>
                <div class="menu-wrapper" style="position: relative;">
                    <button class="kebab-btn" id="kebab-menu-btn" onclick="toggleMenu(false, event)" aria-label="Menu" style="background:none; border:none; color:inherit; cursor:pointer; display:flex; gap:3px;">
                        <span style="width:4px; height:4px; background:currentColor; border-radius:50%;"></span>
                        <span style="width:4px; height:4px; background:currentColor; border-radius:50%;"></span>
                        <span style="width:4px; height:4px; background:currentColor; border-radius:50%;"></span>
                    </button>
                    <div id="dropdown" class="dropdown-menu" style="display:none; position:absolute; right:0; top:40px; background:var(--surface); border:1px solid var(--border); border-radius:12px; min-width:180px;">
                        <div id="social-links"></div>
                    </div>
                </div>
            </div>
        </nav>

        <main id="main-content">
            <section id="home" class="page active">
                <div class="hero">
                    <div class="hero-badge-style">ESTABLISHED 2026</div>
                    <h1 id="hero-title">Architecting Digital Sovereignty.</h1>
                    <p id="hero-desc" class="hero-desc-style">Industrial-grade software assets designed for absolute performance.</p>
                    <div style="display: flex; gap: 15px; flex-wrap: wrap; justify-content: center;">
                        <button class="btn-premium" onclick="navigateTo('market')">VIEW REPOSITORY</button>
                        <button class="btn-premium" style="background:transparent; border:1px solid var(--border); color:var(--text-main);" onclick="navigateTo('about')">THE STANDARD</button>
                    </div>
                </div>
            </section>

            <section id="market" class="page"></section>
            <section id="about" class="page"></section>
        </main>

        <footer>
            <div class="social-strip" style="display:flex; justify-content:center; gap:20px; margin-bottom:20px;">
                <a href="https://instagram.com/frans_marcellino" target="_blank" rel="noopener" style="color:inherit; opacity:0.6;"><i class="fab fa-instagram"></i></a>
                <a href="https://linkedin.com/in/frans-marcellino" target="_blank" rel="noopener" style="color:inherit; opacity:0.6;"><i class="fab fa-linkedin-in"></i></a>
            </div>
            <div style="display:flex; justify-content:center; gap:15px; opacity:0.3;">
                <img src="https://www.w3.org/Icons/valid-html401" alt="W3C" height="20" style="filter:invert(1)">
                <img src="https://jigsaw.w3.org/css-validator/images/vcss-blue" alt="W3C CSS" height="20" style="filter:invert(1)">
            </div>
        </footer>
    </div>

    <script src="assets/js/script.js" defer></script>
    
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;800&family=Playfair+Display:wght@900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" media="print" onload="this.media='all'">

    <noscript>
        <style>.page { display: block !important; opacity: 1 !important; }</style>
    </noscript>
</body>
</html>
