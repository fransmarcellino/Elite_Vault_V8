<!DOCTYPE html>
<html lang="id"> 
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Elite Vault — Digital Architect Portfolio</title>
    <meta name="description" content="Official repository of Frans Marcellino. Industrial-grade software assets.">
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap" media="print" onload="this.media='all'">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <div id="cursor" aria-hidden="true"></div>

    <div class="container">
        <header>
            <nav aria-label="Main Navigation">
                <h1 class="logo">
                    <a href="#top" style="text-decoration: none; color: inherit;" id="nav-logo-text">
                        </a>
                </h1>

                <div class="nav-controls">
                    <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">LIGHT MODE</button>
                    <div class="menu-wrapper" style="position:relative;">
                        <button class="kebab-btn" id="kebab-menu-btn" onclick="toggleMenu(false, event)" aria-label="Open Menu">
                            <span class="dot"></span><span class="dot"></span><span class="dot"></span>
                        </button>
                        <div id="dropdown" class="dropdown-menu" role="menu">
                            <div id="social-links"></div>
                        </div>
                    </div>
                </div>
            </nav>
        </header>

        <main id="main-content">
            <section id="home" class="page active">
                <article class="hero">
                    <div class="hero-badge-style" id="hero-badge">ESTABLISHED 2026</div>
                    <h2 id="hero-title"></h2>
                    <p class="hero-desc-style" id="hero-desc"></p>
                    <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px;">
                        <button class="btn-premium" style="max-width: 280px" onclick="navigateTo('market')">VIEW REPOSITORY</button>
                        <a href="#" id="contact-btn" class="btn-premium" style="max-width: 280px; background: transparent; border: 1px solid var(--border); color: var(--text-main);">CONTACT OPERATOR</a>
                    </div>
                </article>
            </section>

            <section id="market" class="page">
                <header style="text-align: center; margin-bottom: 50px">
                    <h2 id="repo-title">The Repository</h2>
                    <p id="repo-subtitle" style="color: var(--text-dim); font-weight: 300; text-transform: uppercase;"></p>
                </header>
                <div class="search-container" style="max-width: 500px; margin: 0 auto 40px">
                    <input type="text" id="search-bar" aria-label="Search Assets" placeholder="Filter Assets..." onkeyup="handleSearch()">
                </div>
                <div class="grid" id="main-grid"></div>
            </section>

            <section id="about" class="page">
                <div style="max-width: 900px; margin: 0 auto; text-align: center">
                    <h2 id="about-title">Sovereign Architecture</h2>
                    <div class="grid" id="about-grid"></div>
                </div>
            </section>

            <section id="faq" class="page">
                <header style="text-align: center; margin-bottom: 50px">
                    <h2 id="faq-title">Knowledge Base</h2>
                    <p id="faq-subtitle" style="color: var(--text-dim); font-weight: 300; text-transform: uppercase;"></p>
                </header>
                <div class="grid" id="faq-grid"></div>
            </section>
        </main>

        <footer>
            <div class="social-strip" id="footer-socials"></div>
            <p id="footer-text" style="margin-top:20px; font-size:0.8rem; color:var(--text-dim);"></p>
            <div class="validation-logos" id="v-logos"></div>
        </footer>
    </div>

    <div id="modal" role="dialog" aria-modal="true">
        <div class="m-box">
            <h3 style="font-size: 0.7rem; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase;">ASSET SELECTION</h3>
            <p id="target-name" style="font-size: 1.2rem; font-weight: 800; margin-top: 5px; color: var(--primary);"></p>
            <p id="target-price" class="modal-price">$0</p>
            <div class="payment-methods">
                <div class="method-grid" id="payment-grid"></div>
            </div>
            <input type="text" id="client-name" placeholder="VERIFY FULL NAME" class="modal-input">
            <button class="btn-premium" onclick="confirmInquiry()">REQUEST LICENSE</button>
            <button onclick="closeModal()" style="background:none; border:none; color:inherit; cursor:pointer; margin-top:25px; opacity:0.5; font-size:0.7rem; letter-spacing:2px; font-weight:800; display:block; width:100%;">CANCEL PROTOCOL</button>
        </div>
    </div>

    <script src="assets/js/vault-config.js"></script>
    <script src="assets/js/script.js" defer></script>
</body>
</html>
