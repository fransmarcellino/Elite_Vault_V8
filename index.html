<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Loading... | Frans Marcellino</title>
    <meta name="description" content="" id="meta-desc" />
    <meta name="author" content="Frans Marcellino" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&family=Playfair+Display:ital,wght@0,900;1,900&display=swap"
      media="print"
      onload="this.media = 'all'"
    />

    <style>
      /* CORE SYSTEM - Elite Vault v8.2.9 */
      :root {
        --primary: #ffd700;
        --bg: #050505;
        --surface: #0f0f0f;
        --text-main: #fff;
        --text-dim: #888;
        --border: rgba(255, 255, 255, 0.05);
        --transition: cubic-bezier(0.23, 1, 0.32, 1);
        --glow: rgba(255, 215, 0, 0.15);
        --accent-gradient: linear-gradient(45deg, #ffd700, #ff8c00);
      }
      body.light-mode {
        --bg: #f5f5f7;
        --surface: #fff;
        --text-main: #1d1d1f;
        --text-dim: #6e6e73;
        --border: rgba(0, 0, 0, 0.1);
        --glow: rgba(255, 215, 0, 0.3);
      }

      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Plus Jakarta Sans", sans-serif;
        cursor: none;
      }

      #cursor {
        width: 20px;
        height: 20px;
        background: var(--primary);
        border-radius: 50%;
        position: fixed;
        pointer-events: none;
        z-index: 9999;
        mix-blend-mode: difference;
        transition: transform 0.15s ease-out;
        transform: translate3d(-50%, -50%, 0);
        box-shadow: 0 0 20px var(--primary);
        will-change: transform;
      }
      @media (max-width: 768px) {
        #cursor { display: none; }
        * { cursor: auto !important; }
      }

      body {
        background: var(--bg);
        color: var(--text-main);
        line-height: 1.6;
        transition: background 0.5s var(--transition);
        overflow-x: hidden;
      }
      .container {
        max-width: 1300px;
        margin: 0 auto;
        padding: 0 5%;
      }

      nav {
        padding: 20px 0;
        display: flex;
        justify-content: space-between;
        align-items: center;
        position: sticky;
        top: 0;
        z-index: 1000;
        background: var(--bg);
        backdrop-filter: blur(25px);
        border-bottom: 1px solid var(--border);
      }
      .logo {
        font-weight: 800;
        letter-spacing: 4px;
        font-size: 1rem;
        text-transform: uppercase;
        cursor: pointer;
      }
      .logo a { text-decoration: none; color: inherit; }
      .logo span {
        color: var(--primary);
        text-shadow: 0 0 10px var(--glow);
      }
      .nav-controls {
        display: flex;
        align-items: center;
        gap: 15px;
      }
      .theme-toggle {
        background: var(--surface);
        border: 1px solid var(--border);
        color: var(--text-main);
        padding: 10px 18px;
        border-radius: 12px;
        font-weight: 700;
        font-size: 0.75rem;
        transition: 0.3s var(--transition);
        cursor: pointer;
      }
      .kebab-btn {
        background: none;
        border: 1px solid var(--border);
        padding: 12px;
        border-radius: 14px;
        display: flex;
        flex-direction: column;
        gap: 4px;
        cursor: pointer;
      }
      .dot {
        width: 4px;
        height: 4px;
        background: var(--text-main);
        border-radius: 50%;
      }

      .dropdown-menu {
        position: absolute;
        right: 0;
        top: 100%;
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 20px;
        width: 220px;
        z-index: 1001;
        box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        display: none;
        opacity: 0;
        transform: translateY(-10px);
        transition: opacity 0.3s var(--transition), transform 0.3s var(--transition);
        overflow: hidden;
      }
      .dropdown-menu.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
      }
      .page {
        display: none;
        opacity: 0;
        transform: translateY(20px);
        filter: blur(5px);
        transition: opacity 0.6s var(--transition), transform 0.6s var(--transition), filter 0.6s var(--transition);
        padding: 60px 0;
        min-height: 80vh;
      }
      .page.active {
        display: block;
        opacity: 1;
        transform: translateY(0);
        filter: blur(0);
      }

      .hero {
        text-align: center;
        position: relative;
        padding: 120px 0;
      }
      .hero-badge-style {
        font-size: 0.75rem;
        letter-spacing: 8px;
        color: var(--primary);
        margin-bottom: 30px;
        font-weight: 800;
        text-transform: uppercase;
      }
      .hero-desc-style {
        color: var(--text-dim);
        max-width: 750px;
        margin: 0 auto 50px;
        font-size: 1.15rem;
        font-weight: 300;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
        gap: 32px;
        margin-top: 50px;
      }
      .card {
        background: var(--surface);
        border: 1px solid var(--border);
        border-radius: 28px;
        padding: 40px;
        position: relative;
        overflow: hidden;
        backdrop-filter: blur(10px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        transition: 0.6s var(--transition);
        will-change: transform, border-color;
        z-index: 1;
      }
      .card:hover {
        border-color: var(--primary);
        transform: translateY(-12px) scale(1.02);
        box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), 0 0 20px var(--glow);
      }

      .ev-video-bg {
        position: absolute;
        inset: 0;
        z-index: -1;
        opacity: 0;
        transition: opacity 0.6s;
        pointer-events: none;
      }
      .card:hover .ev-video-bg { opacity: 0.15; }

      .card-img {
        width: 100%;
        height: auto;
        aspect-ratio: 4/3;
        border-radius: 20px;
        object-fit: cover;
        margin-bottom: 25px;
        filter: grayscale(1);
        transition: 0.8s var(--transition);
        background: #1a1a1a;
      }
      .card:hover .card-img {
        filter: grayscale(0);
        transform: scale(1.05);
      }
      .price-tag {
        position: absolute;
        top: 30px;
        right: 30px;
        background: var(--accent-gradient);
        color: #000;
        padding: 8px 18px;
        border-radius: 12px;
        font-weight: 900;
        font-size: 0.8rem;
        z-index: 10;
      }
      .btn-premium {
        background: var(--primary);
        color: #000;
        padding: 18px;
        border-radius: 18px;
        width: 100%;
        border: none;
        font-weight: 800;
        text-transform: uppercase;
        cursor: pointer;
        transition: 0.3s var(--transition);
        text-align: center;
        display: inline-block;
        text-decoration: none;
      }

      footer {
        text-align: center;
        padding: 100px 0 60px;
        color: var(--text-dim);
        border-top: 1px solid var(--border);
        margin-top: 80px;
      }
      .social-strip {
        display: flex;
        justify-content: center;
        gap: 30px;
        margin: 30px 0;
      }
      .social-strip a {
        color: var(--text-main);
        font-size: 1.4rem;
        opacity: 0.4;
        transition: 0.3s;
      }
      .social-strip a:hover { opacity: 1; color: var(--primary); }

      #modal {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.85);
        backdrop-filter: blur(15px);
        display: none;
        justify-content: center;
        align-items: center;
        z-index: 2000;
      }
      .m-box {
        background: var(--surface);
        padding: 50px 30px;
        border-radius: 32px;
        width: 100%;
        max-width: 450px;
        text-align: center;
      }
      .modal-price {
        font-size: 3.5rem;
        margin: 20px 0;
        background: var(--accent-gradient);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        font-weight: 900;
      }
    </style>
  </head>
  <body>
    <div id="cursor"></div>

    <div class="container">
      <header>
        <nav>
          <div class="logo">
            <a href="#top" id="site-logo-text">FRANS <span>MARCELLINO</span></a>
          </div>
          <div class="nav-controls">
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">LIGHT MODE</button>
            <div style="position: relative">
              <button class="kebab-btn" onclick="toggleMenu(false, event)">
                <span class="dot"></span><span class="dot"></span><span class="dot"></span>
              </button>
              <div id="dropdown" class="dropdown-menu">
                <div id="social-links"></div>
              </div>
            </div>
          </div>
        </nav>
      </header>

      <main>
        <section id="home" class="page active">
          <article class="hero">
            <h2 class="hero-badge-style" id="hero-badge">ESTABLISHED 2026</h2>
            <p id="hero-title" style="font-family: 'Playfair Display', serif; font-size: clamp(2.5rem, 8vw, 5.5rem); font-weight: 900; margin-bottom: 24px; line-height: 1.1; font-style: italic;">
              Loading...
            </p>
            <p class="hero-desc-style" id="hero-desc">
              Mohon tunggu, sistem sedang memuat arsitektur...
            </p>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-top: 30px;">
              <button class="btn-premium" style="max-width: 280px" onclick="navigateTo('market')">VIEW REPOSITORY</button>
              <a href="#" id="contact-link" class="btn-premium" style="max-width: 280px; background: transparent; border: 1px solid var(--border); color: var(--text-main);">CONTACT OPERATOR</a>
            </div>
          </article>
        </section>

        <section id="market" class="page">
          <header style="text-align: center; margin-bottom: 50px">
            <h2 id="page-market-title" style="font-size: 2.8rem; letter-spacing: -2px; margin-bottom: 10px;">The Repository</h2>
            <p id="page-market-subtitle" style="color: var(--text-dim); font-weight: 300; text-transform: uppercase;">ASSETS BY FRANS MARCELLINO</p>
          </header>
          <div class="grid" id="main-grid"></div>
        </section>
      </main>

      <footer>
        <div class="social-strip" id="footer-socials">
          </div>
        <div id="footer-text" style="margin-top: 20px; font-size: 0.8rem; color: var(--text-dim);"></div>
      </footer>
    </div>

    <div id="modal">
      <div class="m-box">
        <h3 style="font-size: 0.75rem; letter-spacing: 3px; color: var(--text-dim); text-transform: uppercase;">ASSET SELECTION</h3>
        <p id="target-name" style="font-size: 1.2rem; font-weight: 800; margin-top: 5px; color: var(--primary);"></p>
        <p id="target-price" class="modal-price">$0</p>
        <button class="btn-premium" onclick="confirmInquiry()">REQUEST LICENSE</button>
        <button onclick="closeModal()" style="background: none; border: none; color: inherit; cursor: pointer; margin-top: 25px; opacity: 0.5; font-size: 0.75rem; letter-spacing: 2px; font-weight: 800; display: block; width: 100%;">CANCEL PROTOCOL</button>
      </div>
    </div>

    <script>
      // 1. Fungsi Utama Penarik Data
      async function syncWithConfig() {
        try {
          const response = await fetch('./config.json');
          const data = await response.json();

          // A. SINKRONISASI JUDUL & SEO
          document.title = `${data.website_settings.site_title} — ${data.ai_asisten.owner}`;
          document.getElementById('meta-desc').setAttribute('content', data.ai_asisten.core_task);
          
          // B. SINKRONISASI HERO SECTION
          document.getElementById('hero-title').innerText = data.website_settings.home_page_title;
          document.getElementById('hero-desc').innerText = data.ai_asisten.core_task;
          document.getElementById('hero-badge').innerText = `OWNED BY ${data.ai_asisten.owner}`;

          // C. SINKRONISASI HALAMAN MARKET
          document.getElementById('page-market-title').innerText = data.website_settings.services_page_title;
          
          // D. SINKRONISASI PRODUK (MENCAKUP HARGA, FOTO, JUDUL, DESKRIPSI)
          const grid = document.getElementById('main-grid');
          grid.innerHTML = ''; // Bersihkan loading statis
          
          data.product_cards.forEach(product => {
            const card = `
              <article class="card">
                <div class="price-tag">${product.price}</div>
                <img src="${product.image}" alt="${product.title}" class="card-img">
                <h3 style="color: var(--primary); margin-bottom: 15px; font-size: 1.5rem;">${product.title}</h3>
                <p style="color: var(--text-dim); font-size: 0.95rem; margin-bottom: 25px;">${product.description}</p>
                <button class="btn-premium" onclick="openModal('${product.title}', '${product.price}')">ACQUIRE ASSET</button>
              </article>
            `;
            grid.innerHTML += card;
          });

          // E. SINKRONISASI FOOTER
          document.getElementById('footer-text').innerHTML = `&copy; 2026 ${data.ai_asisten.owner} | Elite Vault v8.2.9 | All Rights Reserved.`;

          console.log("System Synced Successfully.");
        } catch (error) {
          console.error("Critical Error: Gagal sinkronisasi data!", error);
        }
      }

      // 2. Fungsi Modal Dinamis
      function openModal(name, price) {
        document.getElementById('target-name').innerText = name;
        document.getElementById('target-price').innerText = price;
        document.getElementById('modal').style.display = 'flex';
      }

      function closeModal() {
        document.getElementById('modal').style.display = 'none';
      }

      // Jalankan sinkronisasi saat halaman dibuka
      window.onload = syncWithConfig;

      // Fungsi navigasi sederhana
      function navigateTo(pageId) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
        document.getElementById(pageId).classList.add('active');
        window.scrollTo(0,0);
      }

      // Mouse Cursor Logic
      const cursor = document.getElementById('cursor');
      document.addEventListener('mousemove', e => {
        cursor.style.left = e.clientX + 'px';
        cursor.style.top = e.clientY + 'px';
      });
    </script>
    <script src="assets/js/script.js" defer></script>
  </body>
</html>
