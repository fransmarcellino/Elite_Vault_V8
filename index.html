<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Frans Marcellino | Elite Vault v8.0</title>
    <style>
        /* --- CORE THEME ENGINE --- */
        :root {
            --primary: #ffd700; 
            --bg: #050505;
            --surface: #0f0f0f;
            --text-main: #fff;
            --text-dim: #888;
            --border: rgba(255, 255, 255, 0.05);
            --transition: cubic-bezier(0.23, 1, 0.32, 1);
            --glow: rgba(255, 215, 0, 0.15);
            --accent-gradient: linear-gradient(45deg, #ffd700, #ff8c00);
        }

        body { margin: 0; background: var(--bg); color: var(--text-main); font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        
        nav { display: flex; justify-content: space-between; align-items: center; padding: 20px 0; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 800; letter-spacing: 2px; color: var(--primary); cursor: pointer; }
        
        .hero { text-align: center; padding: 80px 0; }
        .hero h1 { font-size: 3rem; margin-bottom: 10px; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero p { color: var(--text-dim); max-width: 600px; margin: 0 auto; line-height: 1.6; }

        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 30px; margin-top: 50px; }
        .card { background: var(--surface); border: 1px solid var(--border); border-radius: 15px; padding: 20px; transition: var(--transition); position: relative; overflow: hidden; }
        .card:hover { transform: translateY(-10px); border-color: var(--primary); box-shadow: 0 10px 30px var(--glow); }
        .card img { width: 100%; height: 200px; object-fit: cover; border-radius: 10px; margin-bottom: 15px; }
        .price { color: var(--primary); font-weight: bold; font-size: 1.2rem; }
        
        .theme-toggle { background: none; border: 1px solid var(--primary); color: var(--primary); padding: 5px 15px; border-radius: 20px; cursor: pointer; font-size: 0.8rem; }
        footer { text-align: center; padding: 50px 0; color: var(--text-dim); font-size: 0.8rem; border-top: 1px solid var(--border); margin-top: 100px; }
    </style>
</head>
<body>

<div class="container">
    <nav>
        <div class="logo" id="nav-logo">FRANS MARCELLINO</div>
        <div class="nav-controls">
            <button class="theme-toggle" id="theme-btn">DARK MODE</button>
        </div>
    </nav>

    <div class="hero">
        <h1 id="hero-title"></h1>
        <p id="hero-desc"></p>
    </div>

    <div class="grid" id="product-grid"></div>

    <footer id="footer-text"></footer>
</div>

<script>
    const VAULT_DATA = {
        owner: {
            fullName: "Frans Marcellino",
            badge: "[ Sovereign Repository v8.0 ]"
        },
        content: {
            heroTitle: "Architecting Digital Sovereignty.",
            heroDesc: "Industrial-grade software assets designed for those who demand absolute performance and uncompromising aesthetic perfection.",
            footer: "© 2026 FRANS MARCELLINO — ALL RIGHTS RESERVED"
        },
        products: [
            { name: "Titan Core", price: "$1,290", desc: "Enterprise SaaS Framework.", img: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400" },
            { name: "Quantum UI", price: "$750", desc: "Kinetic React Components.", img: "https://images.unsplash.com/photo-1639762681485-074b7f938ba0" },
            { name: "SecureAuth X", price: "$490", desc: "Zero-Knowledge Auth Suite.", img: "https://images.unsplash.com/photo-1550745165-9bc0b252726f" },
            { name: "Nebula AI", price: "$2,999", desc: "Neural Integration Engine.", img: "https://images.unsplash.com/photo-1677442136019-21780ecad995" },
            { name: "Apex CMS", price: "$1,800", desc: "Headless Content Engine.", img: "https://images.unsplash.com/photo-1451187580459-43490279c0fa" },
            { name: "Zenith ERP", price: "$4,500", desc: "Global Logistics Logic.", img: "https://images.unsplash.com/photo-1460925895917-afdab827c52f" }
        ]
    };

    // Render Data
    document.getElementById('hero-title').innerText = VAULT_DATA.content.heroTitle;
    document.getElementById('hero-desc').innerText = VAULT_DATA.content.heroDesc;
    document.getElementById('footer-text').innerText = VAULT_DATA.content.footer;

    const grid = document.getElementById('product-grid');
    VAULT_DATA.products.forEach(p => {
        grid.innerHTML += `
            <div class="card">
                <img src="${p.img}" alt="${p.name}">
                <h3>${p.name}</h3>
                <p>${p.desc}</p>
                <div class="price">${p.price}</div>
            </div>
        `;
    });
</script>

</body>
</html>
