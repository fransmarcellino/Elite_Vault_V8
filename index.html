<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Frans Marcellino | Elite Vault v8.0</title>
    <meta name="description" content="Sovereign Digital Repository by Frans Marcellino." />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;700;800&display=swap" rel="stylesheet" />

    <link rel="stylesheet" href="assets/css/style.css" />

    <style>
      /* Style khusus 8 bingkai agar langsung muncul meski tanpa gambar */
      .cinematic-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 15px;
        margin: 40px 0;
      }
      @media (min-width: 768px) {
        .cinematic-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }
      }
      .cinematic-item {
        position: relative;
        aspect-ratio: 1/1;
        overflow: hidden;
        border-radius: 20px;
        border: 1px solid var(--border);
        /* Warna dasar jika gambar tidak muncul */
        background: linear-gradient(135deg, #111 0%, #222 100%);
        transition: 0.5s var(--transition);
      }
      .cinematic-item:hover {
        border-color: var(--primary);
        transform: translateY(-5px);
      }
      .cinematic-item img {
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.6; /* Supaya terlihat estetik */
        transition: 5s linear;
      }
      .cinematic-item:hover img {
        transform: scale(1.2);
        opacity: 1;
      }
      .item-label {
        position: absolute;
        bottom: 12px;
        left: 12px;
        font-size: 9px;
        font-weight: 800;
        color: var(--primary);
        letter-spacing: 1px;
        text-transform: uppercase;
        background: rgba(0, 0, 0, 0.8);
        padding: 4px 8px;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div id="cursor"></div>

    <div class="container">
      <nav>
        <div class="logo" id="nav-logo" onclick="navigateTo('home')" style="cursor: pointer">
          FRANS <span>MARCELLINO</span>
        </div>

        <div class="nav-controls">
          <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn">LIGHT MODE</button>
          <div class="menu-wrapper" style="position: relative">
            <button class="kebab-btn" onclick="toggleMenu()">
              <span class="dot"></span><span class="dot"></span><span class="dot"></span>
            </button>
            <div id="dropdown" class="dropdown-menu">
              <div id="social-links"></div>
            </div>
          </div>
        </div>
      </nav>

      <main>
        <section id="home" class="page active">
          <div class="hero">
            <div class="hero-glow"></div>
            <div id="hero-badge" class="hero-badge-style">SOVEREIGN DIGITAL ASSET</div>
            <h1 id="hero-title">Architecting Digital Sovereignty.</h1>
            <p id="hero-desc" class="hero-desc-style">High-end software assets and cinematic digital repository.</p>
            <div style="display: flex; gap: 15px; justify-content: center; flex-wrap: wrap;">
              <button class="btn-premium" style="max-width: 280px" onclick="navigateTo('market')">VIEW REPOSITORY</button>
              <button class="btn-premium" style="max-width: 280px; background: transparent; border: 1px solid var(--border); color: var(--text-main);" onclick="navigateTo('about')">THE STANDARD</button>
            </div>
          </div>
        </section>

        <section id="market" class="page">
          <div style="text-align: center; margin-bottom: 30px">
            <h2 style="font-size: 2.8rem; letter-spacing: -2px;">The Repository</h2>
            <p style="color: var(--text-dim); font-weight: 300">Curated AI Cinematic Assets</p>
          </div>

          <div class="cinematic-grid">
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=1" alt="Asset">
              <div class="item-label">VAULT 01</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=2" alt="Asset">
              <div class="item-label">VAULT 02</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=3" alt="Asset">
              <div class="item-label">VAULT 03</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=4" alt="Asset">
              <div class="item-label">VAULT 04</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=5" alt="Asset">
              <div class="item-label">VAULT 05</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=6" alt="Asset">
              <div class="item-label">VAULT 06</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=7" alt="Asset">
              <div class="item-label">VAULT 07</div>
            </div>
            <div class="cinematic-item">
              <img src="https://picsum.photos/500/500?random=8" alt="Asset">
              <div class="item-label">VAULT 08</div>
            </div>
          </div>

          <input type="text" id="search-bar" placeholder="Filter Assets..." onkeyup="handleSearch()" style="width: 100%; max-width: 500px; margin: 20px auto; display: block; padding: 18px; background: var(--surface); border: 1px solid var(--border); border-radius: 18px; color: var(--text-main); outline: none;" />
          <div class="grid" id="main-grid"></div>
        </section>

        </main>
    </div>

    <script src="assets/js/script.js"></script>
  </body>
</html>
